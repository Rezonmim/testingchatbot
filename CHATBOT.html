<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezon Chat Widget</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* Floating Button */
#chat-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #5b5fff, #7c3aed);
  color: white;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  z-index: 9999;
  transition: 0.3s;
}

#chat-btn:hover {
  transform: scale(1.1);
}

/* Chat Container */
#chat-box {
  position: fixed;
  bottom: 100px;
  right: 20px;
  width: 400px;
  height: 700px;
  background: #fff;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  transform: scale(0);
  transform-origin: bottom right;
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  z-index: 9999;
}

#chat-box.active {
  transform: scale(1);
}

/* Header */
#chat-header {
  background: linear-gradient(135deg, #5b5fff, #7c3aed);
  color: #fff;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#chat-header span {
  font-size: 16px;
}

#chat-header button {
  background: none;
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

/* Chat iframe */
#chat-box iframe {
  flex: 1;
  border: none;
}

/* Greeting Bubble */
#greeting {
  position: fixed;
  bottom: 100px;
  right: 100px;
  background: #fff;
  padding: 10px 16px;
  border-radius: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
  font-size: 14px;
  animation: fadeIn 0.5s ease;
  z-index: 9999;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}

/* Mobile Responsive */
@media (max-width: 500px) {
  #chat-box {
    width: 95%;
    height: 90%;
    right: 2.5%;
    bottom: 80px;
  }

  #greeting {
    right: 80px;
  }
}
</style>
</head>

<body>

<!-- Greeting -->
<div id="greeting">Hi 👋 How can I help you?</div>

<!-- Chat Box -->
<div id="chat-box">
  <div id="chat-header">
    <span>Chat Support</span>
    <button onclick="toggleChat()">✕</button>
  </div>

  <iframe 
/* Replace with your Chatbot Link below */
    src="https://rezonsai.com/chat/bot_8zplivpua"
    allow="clipboard-write; microphone"
  ></iframe>
</div>

<!-- Floating Button -->
<button id="chat-btn" onclick="toggleChat()">💬</button>

<script>
const chatBox = document.getElementById("chat-box");
const greeting = document.getElementById("greeting");

function toggleChat() {
  chatBox.classList.toggle("active");
  greeting.style.display = "none";
}

// Auto-hide greeting after 5 sec
setTimeout(() => {
  greeting.style.display = "none";
}, 5000);
</script>

</body>
</html>
